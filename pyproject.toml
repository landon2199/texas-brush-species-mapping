[project]
name = "brushmap"
version = "0.1.0"
description = "What can a 10 m pixel see? Ashe juniper and honey mesquite in Texas with Sentinel-1, Sentinel-2 and lidar, spatially validated"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Landon Melesky" }]

[tool.setuptools]
packages = ["brushmap"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
